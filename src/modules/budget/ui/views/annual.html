<section id="tab-annual" class="tab-content hidden space-y-6">
    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-6">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-200 dark:border-slate-700 pb-5">
            <div>
                <h2 class="text-lg font-bold flex items-center gap-2">
                    <i class="fa-solid fa-calendar-days text-indigo-500"></i> Tableau Prévisionnel sur 12 Mois
                </h2>
                <p class="text-sm text-slate-500 dark:text-slate-400">Tableau récapitulatif synchronisé en temps réel avec vos dépenses réelles.</p>
            </div>
            <div class="flex items-center gap-2">
                <button id="btn-rollover-annual" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs rounded-xl shadow transition flex items-center gap-1.5">
                    <i class="fa-solid fa-box-archive"></i> Clôturer &amp; Archiver
                </button>
            </div>
        </div>

        <!-- Annual Trend Chart -->
        <div class="bg-slate-50 dark:bg-slate-700/30 p-4 rounded-xl border border-slate-200 dark:border-slate-700">
            <h3 class="text-sm font-semibold mb-3 flex items-center gap-2">
                <i class="fa-solid fa-chart-line text-indigo-500"></i> Trajectoire du Patrimoine Cumulé sur l'Année
            </h3>
            <div class="h-64 w-full">
                <canvas id="chart-annual-trend"></canvas>
            </div>
        </div>

        <!-- 12 Month Table -->
        <div class="overflow-x-auto rounded-xl border border-slate-200 dark:border-slate-700">
            <table class="w-full text-left border-collapse text-sm">
                <thead>
                    <tr class="bg-slate-100 dark:bg-slate-700 text-xs text-slate-600 dark:text-slate-300 uppercase tracking-wider">
                        <th class="p-3 sticky left-0 bg-slate-100 dark:bg-slate-700 z-10">Mois</th>
                        <th class="p-3 text-emerald-600 dark:text-emerald-400">Revenus (€)</th>
                        <th class="p-3 text-rose-600 dark:text-rose-400">Logement (€)</th>
                        <th class="p-3 text-amber-600 dark:text-amber-400">Voiture (€)</th>
                        <th class="p-3 text-orange-600 dark:text-orange-400">Nourriture (€)</th>
                        <th class="p-3 text-teal-600 dark:text-teal-400">Abos (€)</th>
                        <th class="p-3 text-purple-600 dark:text-purple-400">Invest. (€)</th>
                        <th class="p-3 text-right">Reste à vivre</th>
                    </tr>
                </thead>
                <tbody id="annual-table-body" class="divide-y divide-slate-200 dark:divide-slate-700">
                </tbody>
            </table>
        </div>
    </div>
</section>
