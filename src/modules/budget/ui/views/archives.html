<section id="tab-archives" class="tab-content hidden space-y-6">
    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-6">
        <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-700 pb-4">
            <div>
                <h2 class="text-lg font-bold flex items-center gap-2">
                    <i class="fa-solid fa-box-archive text-violet-500"></i> Historique des Bilans Annuels
                </h2>
                <p class="text-xs text-slate-500 dark:text-slate-400">Consultez vos bilans clôturés des années précédentes.</p>
            </div>
            <button id="btn-manual-archive" class="px-3.5 py-1.5 bg-violet-600 hover:bg-violet-700 text-white font-semibold text-xs rounded-xl shadow transition">
                Archiver la période actuelle
            </button>
        </div>
        <div id="archives-list" class="space-y-4">
            <!-- Dynamic archives -->
        </div>

        <!-- Détail d'un bilan archivé (rempli par archives.ts) -->
        <div id="archive-detail" class="hidden space-y-5">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div>
                    <h3 id="archive-detail-title" class="font-bold text-base text-slate-900 dark:text-white"></h3>
                    <p id="archive-detail-period" class="text-xs text-slate-500"></p>
                </div>
                <div class="flex items-center gap-2">
                    <button id="btn-archive-export" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 transition flex items-center gap-1.5">
                        <i class="fa-solid fa-download text-violet-500"></i> Exporter ce bilan
                    </button>
                    <button id="btn-archive-back" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-violet-600 hover:bg-violet-700 text-white transition flex items-center gap-1.5">
                        <i class="fa-solid fa-arrow-left"></i> Retour à la liste
                    </button>
                </div>
            </div>
            <div id="archive-detail-kpis" class="grid grid-cols-2 lg:grid-cols-5 gap-3"></div>
            <div class="bg-slate-50 dark:bg-slate-700/30 p-4 rounded-xl border border-slate-200 dark:border-slate-700">
                <h4 class="text-sm font-semibold mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-chart-column text-violet-500"></i> Prévu et réel, mois par mois
                </h4>
                <div class="h-64 w-full">
                    <canvas id="chart-archive"></canvas>
                </div>
            </div>
            <div id="archive-detail-months" class="space-y-2"></div>
        </div>
    </div>
</section>
