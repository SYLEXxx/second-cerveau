# Construit l'application Android (.apk) à chaque envoi sur main, ou à la demande
# (onglet Actions > « Application Android » > Run workflow).
# L'APK est téléchargeable dans les « Artifacts » de l'exécution.
name: Application Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Construire l'APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: second-cerveau-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
