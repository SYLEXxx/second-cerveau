# Construit l'installateur Windows (.exe) à chaque envoi sur main, ou à la demande
# (onglet Actions > « Application PC (Windows) » > Run workflow).
# L'installateur est téléchargeable dans les « Artifacts » de l'exécution.
name: Application PC (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - name: Construire l'installateur
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: second-cerveau-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
